# Local development services. Production uses Fly Managed Postgres and Upstash Redis.
services:
  postgres:
    # Same major version as Neon staging.
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wepunch
    ports:
      - "54322:5432"
    volumes:
      # Postgres 18 images keep data under a versioned subdirectory, so the
      # volume mounts one level up from the old /var/lib/postgresql/data.
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "63799:6379"

volumes:
  pgdata18:
